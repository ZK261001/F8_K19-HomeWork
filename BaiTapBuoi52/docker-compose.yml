services:
    api:
        container_name: topcv-api
        image: node:25
        working_dir: /app/api
        volumes:
            - ./api:/app/api
        ports:
            - "3000:3000"
        command: sh -c "npm install && npm run start:dev"
        env_file:
            - ./api/.env
        depends_on:
            - db

    db:
        container_name: topcv-db
        image: postgres:17
        ports:
            - 5000:5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - ./db:/var/lib/postgresql/data
