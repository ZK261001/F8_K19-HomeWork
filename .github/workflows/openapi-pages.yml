name: Deploy OpenAPI docs

on:
    push:
        branches: [main]
        paths: ["BaiTapBuoi51/api/**"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: BaiTapBuoi51/api
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: BaiTapBuoi51/api/package-lock.json
            - run: npm ci
            - run: npm run openapi
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: BaiTapBuoi51/api/docs

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
