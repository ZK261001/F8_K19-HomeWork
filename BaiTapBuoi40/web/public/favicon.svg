<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Favicon hiển thị ở 16x16 nên đây là bản rút gọn của src/assets/logo.svg:
    bỏ huy hiệu dấu tích (ở cỡ đó nó chỉ còn là một đốm trắng đè lên chữ T) và
    làm nét chữ T dày hơn logo để không bị mảnh đi khi thu nhỏ.
    Nền tràn viền, không chừa lề — icon nhỏ mà có lề sẽ càng khó đọc.
  -->
  <rect width="32" height="32" rx="7" fill="#00B14F" />
  <g fill="#fff">
    <rect x="6.5" y="8" width="19" height="5.2" rx="1.3" />
    <rect x="13.4" y="8" width="5.2" height="16.5" rx="1.3" />
  </g>
</svg>
