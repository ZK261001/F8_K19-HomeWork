<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>

<body>
    <h1 style="color: azure;">ORDERS PAGE</h1>
    <!--
            Phan tu nay co:
                tag: h2
                class: .title
                id: #special
                css inline: style="color: chocolate"

            Quy tac xet do uu tien:
                Selector thang: inline style
                Ly do: inline style co do uu tien cao nhat trong CSS

            Mau hien thi cuoi cung: chocolate
        -->
    <h2 class="title" id="special" style="color: chocolate;">Danh sach don hang</h2>

    <!--
            Phan tu nay co:
                tag: p
                class: .highlight
                id: #special
                css inline: style="color: darkblue"

            Quy tac xet do uu tien:
                Selector thang: inline style
                Ly do: inline style co do uu tien cao nhat trong CSS

            Mau hien thi cuoi cung: darkblue
        -->
    <p style="color: darkblue;" class="highlight" id="special">Don hang 001</p>
    <p style="color: rgb(233, 22, 205);">Don hang 002</p>
    <p class="highlight">Don hang 003</p>
    <p class="highlight">Don hang 004</p>

</body>

</html>
