<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square {
            width: 100px;
            height: 100px;
            border: 5px solid red;
            margin-bottom: 10px;
        }

        .rectangle {
            width: 200px;
            height: 100px;
            border: 5px solid blue;
        }

        .triangle--up {
            width: 0;
            border-left: 55px solid transparent;
            border-right: 55px solid transparent;
            border-bottom: 95px solid green;
            margin-bottom: 10px;
        }

        .triangle--down {
            width: 0;
            border-left: 55px solid transparent;
            border-right: 55px solid transparent;
            border-top: 95px solid #e67e22;
            margin-bottom: 10px;
        }

        .triangle--left {
            width: 0;
            border-top: 55px solid transparent;
            border-bottom: 55px solid transparent;
            border-right: 95px solid purple;
            margin-bottom: 10px;
        }

        .triangle--right {
            width: 0;
            border-top: 55px solid transparent;
            border-bottom: 55px solid transparent;
            border-left: 95px solid #e67e22;
            margin-bottom: 10px;
        }

        .trapezium {
            width: 50px;
            border: 50px solid;
            border-color: transparent transparent lightblue;
            margin-bottom: 10px;
        }

        .triangle--wide {
            width: 0;
            height: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-bottom: 65px solid #2c3e50;
        }

        .triangle--pointed {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 130px solid #c0392b;
            margin-bottom: 10px;
        }

        .triangle--isosceles {
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 80px solid #c0392b;
        }

        .arrow--right {
            width: 0;
            height: 0;
            border-top: 35px solid transparent;
            border-bottom: 35px solid transparent;
            border-left: 65px solid #1abc9c;
        }

        .arrow--left {
            width: 0;
            height: 0;
            border-top: 35px solid transparent;
            border-bottom: 35px solid transparent;
            border-right: 65px solid purple;
        }

        .ribbon {
            width: 0;
            height: 0;
            border-top: 45px solid #c0392b;
            border-bottom: 45px solid #c0392b;
            border-right: 30px solid transparent;
            border-left: 70px solid #c0392b;
            margin-bottom: 20px;
        }

        /* F8 */
        .f {
            display: inline-block;
        }

        .f01 {
            width: 40px;
            height: 40px;
            border-top: 40px solid #c0392b;
            border-left: 40px solid #c0392b;
            border-bottom: 40px solid #c0392b;
            border-right: 0px solid transparent;
            padding-right: 40px;
        }

        .f02 {
            margin-top: -5px;
            width: 40px;
            height: 85px;
            border-left: 40px solid #c0392b;
        }

        .number-8 {
            display: inline-block;
        }

        .top-box {
            width: 40px;
            height: 40px;
            border-top: 40px solid #c0392b;
            border-left: 40px solid #c0392b;
            border-bottom: 20px solid #c0392b;
            border-right: 40px solid #c0392b;
            margin-right: 5px;
            padding-right: 40px;

        }

        .bottom-box {
            width: 40px;
            height: 40px;
            border-top: 20px solid #c0392b;
            border-left: 40px solid #c0392b;
            border-bottom: 40px solid #c0392b;
            border-right: 40px solid #c0392b;
            margin-right: 5px;
            padding-right: 40px;

        }
    </style>
</head>

<body>
    <div class="square"></div>
    <div class="rectangle"></div>
    <div class="triangle--up"></div>
    <div class="triangle--down"></div>
    <div class="triangle--left"></div>
    <div class="triangle--right"></div>
    <div class="trapezium"></div>
    <div class="triangle--wide"></div>
    <div class="triangle--pointed"></div>
    <div class="triangle--isosceles"></div>
    <div class="arrow--right"></div>
    <div class="arrow--left"></div>
    <div class="ribbon"></div>
    <!-- F8 -->
    <div class="wrapper">
        <div class="f">
            <div class="f01"></div>
            <div class="f02"></div>
        </div>
        <div class="number-8">
            <div class="top-box"></div>
            <div class="bottom-box"></div>
        </div>
    </div>
</body>

</html>
